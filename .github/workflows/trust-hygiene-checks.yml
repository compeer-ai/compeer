name: Trust and Hygine Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read
  issues: read

jobs:
  trust-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check if denounced
        id: trust
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const author = context.payload.pull_request.user.login;
            const denounced = JSON.parse(fs.readFileSync('.github/denounced.json', 'utf8'));
            const isDenounced = denounced.some(entry => entry && entry.username === author);

            core.setOutput('author', author);
            core.setOutput('isDenounced', String(isDenounced));
      - name: Note zero karma
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const author = context.actor;
            const karma = JSON.parse(fs.readFileSync('.github/karma.json', 'utf8'));
            const entry = karma.find(item => item && item.username === author);
            const marker = `<!-- karma-zero:${author} -->`;

            if (entry && Number(entry.karma) === 0) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });

              const alreadyNoted = comments.some(comment =>
                typeof comment.body === 'string' && comment.body.includes(marker)
              );

              if (alreadyNoted) {
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `@${author} has a karma score of 0.\n\n${marker}`
              });
            }
      - name: Close if denounced
        if: steps.trust.outputs.isDenounced == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
  hygiene-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if invalid PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || '';
            const titlePattern = /^(feat|fix|chore)(\([^)]+\))?([: ][\s]?).*/;
            const hasValidTitle = titlePattern.test(title);

            if (!hasValidTitle) {
              core.setFailed('PR title must start with feat, fix, or chore (optional scope).');
            }
      - name: Fail if no valid Resolve issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/Resolves\s+#?(\d+)/i);

            if (!match) {
              core.setFailed('PR description must include "Resolves #<issue_number>".');
              return;
            }

            const issueNumber = Number(match[1]);

            try {
              await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
            } catch (error) {
              console.log(error.message)
              core.setFailed(`Referenced issue #${issueNumber} does not exist or is inaccessible.`);
            }
